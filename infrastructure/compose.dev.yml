name: profactur-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - profactur_postgres_data:/var/lib/postgresql/data
    networks:
      - profactur_network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - profactur_redis_data:/data
    networks:
      - profactur_network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: profactur-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      VERIFACTU_ENVIRONMENT: ${VERIFACTU_ENVIRONMENT:-TEST}
      VERIFACTU_INSTALLATION_NUMBER: ${VERIFACTU_INSTALLATION_NUMBER:-1}
    ports:
      - "127.0.0.1:3101:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - profactur_network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          fetch('http://127.0.0.1:3001/health')
          .then(response => {
            if (!response.ok) process.exit(1);
          })
          .catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  profactur_network:
    driver: bridge

volumes:
  profactur_postgres_data:
  profactur_redis_data: